<title>Books</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
/* Layout: one working column. Sticky bar (entity + sync), tab strip, then the active view.
   Money in = blue, money out = orange (validated CVD-safe pair); everything else is ink on cool paper. */
:root {
  --bg: #F1F4F3; --surface: #FBFCFB; --sunk: #E8EDEB; --ink: #15201D; --ink2: #44524E; --muted: #6E7C78;
  --line: #D6DEDB; --accent: #0E5C4E; --accent-ink: #FFFFFF; --accent-soft: #D7EBE5;
  --in: #2F6BD0; --out: #D2761F; --warn: #9A5B00; --warn-soft: #FBEBD0; --crit: #B42318; --crit-soft: #FBE1DE; --good: #1D6B45; --good-soft: #DAF0E3; --e1: #00806A; --e2: #8E4EC6;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1211; --surface: #141A19; --sunk: #1B2321; --ink: #E5ECE9; --ink2: #B2BEBA; --muted: #84928E;
  --line: #29332F; --accent: #5CC2A8; --accent-ink: #06201A; --accent-soft: #173A32;
  --in: #4F86E0; --out: #CF7A2E; --warn: #E8B45C; --warn-soft: #3A2C12; --crit: #F28B82; --crit-soft: #3D1C19; --good: #6FCF97; --good-soft: #15342A; --e1: #2AA58C; --e2: #A97BE0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1211; --surface: #141A19; --sunk: #1B2321; --ink: #E5ECE9; --ink2: #B2BEBA; --muted: #84928E;
  --line: #29332F; --accent: #5CC2A8; --accent-ink: #06201A; --accent-soft: #173A32;
  --in: #4F86E0; --out: #CF7A2E; --warn: #E8B45C; --warn-soft: #3A2C12; --crit: #F28B82; --crit-soft: #3D1C19; --good: #6FCF97; --good-soft: #15342A; --e1: #2AA58C; --e2: #A97BE0;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.brand { font: 700 22px/1 var(--f-display); letter-spacing: -0.01em; margin-right: auto; }
.brand small { font: 500 11px var(--f-body); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-left: 8px; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--ink2); font: 600 13px var(--f-body); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.syncbox { display: flex; align-items: center; gap: 10px; }
.synced { font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 6px 0; }
nav.tabs a { color: var(--ink2); text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 12px; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--accent); }
.count { font: 600 11px var(--f-num); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 7px; }
main { padding-block: 18px 64px; display: grid; gap: 16px; }
h2 { font: 700 20px/1.2 var(--f-display); margin: 0; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
button, .btn { font: 600 14px var(--f-body); border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; }
button:disabled { opacity: 0.55; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font: 14px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%; }
textarea { width: 100%; min-height: 120px; font-family: var(--f-num); font-size: 13px; }
.status { border-radius: var(--r); padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.status.info { background: var(--accent-soft); }
.status.warn { background: var(--warn-soft); }
.status.crit { background: var(--crit-soft); }
.bar-progress { height: 4px; background: var(--sunk); border-radius: 4px; overflow: hidden; flex: 1 1 140px; }
.bar-progress i { display: block; height: 100%; background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink2); border-radius: 999px; padding: 5px 12px; font: 600 13px var(--f-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tag { display: inline-block; font: 600 11px/1.6 var(--f-body); letter-spacing: 0.04em; text-transform: uppercase; padding: 0 7px; border-radius: 4px; background: var(--sunk); color: var(--ink2); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.crit { background: var(--crit-soft); color: var(--crit); }
.tag.good { background: var(--good-soft); color: var(--good); }
.list { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.card .r1 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.card .meta { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.who { font-weight: 600; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.who .sub { font-weight: 400; font-size: 13px; color: var(--muted); display: block; }
.amt { font: 600 18px var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.in { background: var(--in); } .dot.out { background: var(--out); } .dot.net { background: var(--ink2); } .dot.e1 { background: var(--e1); } .dot.e2 { background: var(--e2); }
.delta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.tile .k { min-width: 0; overflow-wrap: anywhere; }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 1.3fr) 2fr auto 3.2em; gap: 10px; align-items: center; font-size: 13px; }
.hbar .l { overflow-wrap: anywhere; min-width: 0; }
.hbar .track { height: 10px; background: var(--sunk); border-radius: 0 4px 4px 0; }
.hbar .track i { display: block; height: 100%; background: var(--out); border-radius: 0 4px 4px 0; }
.hbar .a, .hbar .s { text-align: right; }
.hbar .s { color: var(--muted); }
.meters { display: grid; gap: 10px; margin-top: 6px; }
.small-amt { font-size: 14px; }
table.cov td, table.cov th { text-align: center; padding: 6px 4px; }
table.cov td:first-child, table.cov th:first-child { text-align: left; white-space: nowrap; }
@media (max-width: 560px) { .hbar { grid-template-columns: 1fr auto; } .hbar .track { grid-column: 1 / -1; grid-row: 2; } .hbar .s { display: none; } }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; }
.fields { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fields input[type=text] { flex: 1 1 220px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink2); }
.inv { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 8px; }
.inv .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inv .head .label { font-size: 13px; font-weight: 600; margin-right: auto; }
.att { display: flex; gap: 8px; align-items: center; font-size: 13px; background: var(--sunk); border-radius: 8px; padding: 6px 10px; min-width: 0; }
.att a { color: var(--accent); overflow-wrap: anywhere; }
.results { display: grid; gap: 6px; }
.res { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.res .s { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.res .f { color: var(--muted); grid-column: 1; overflow-wrap: anywhere; }
.res button { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.qrow { display: flex; gap: 6px; flex-wrap: wrap; }
.qrow input { flex: 1 1 260px; font-family: var(--f-num); font-size: 12px; }
.suggest { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 13px; background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.err { color: var(--crit); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: flex; gap: 6px; align-items: center; }
.tile .v { font: 600 22px var(--f-num); font-variant-numeric: tabular-nums; margin-top: 4px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }
.party { max-width: 280px; overflow-wrap: anywhere; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .grow { flex: 1 1 200px; }
.health { display: grid; gap: 6px; }
.health li { display: flex; gap: 10px; align-items: center; }
ul.plain { list-style: none; padding: 0; margin: 0; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); }
.empty { text-align: center; padding: 36px 16px; display: grid; gap: 10px; justify-items: center; }
.empty h2 { font-size: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.preview td { font-size: 12px; }
@media (max-width: 560px) { .amt { font-size: 16px; } .brand small { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Books<small>CodeCrust · AITA</small></div>
    <div class="seg" id="entity-seg" role="group" aria-label="Company"></div>
    <div class="syncbox"><span class="synced" id="synced"></span><button class="primary" id="sync-btn" data-act="sync">Sync Gmail</button></div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" aria-label="Views"></nav></div>
</header>
<div class="wrap"><main id="main"></main></div>
<script>/*@@PARSER@@*/</script>
<script>
'use strict';
const P = window.BankParse;
const ENTITIES = { codecrust: 'CodeCrust', aita: 'AITA Technologies' };
const SENDERS = ['alerts@hdfcbank.bank.in', 'alerts@hdfcbank.net', 'indusind_bank@indusind.com'];
const GMAIL = 'Gmail';
const BANKS = { hdfc: 'HDFC', indusind: 'IndusInd', other: 'Bank' };
const DEFAULT_SINCE = '2026-04-01';
const CATS_OUT = ['Salaries & contractors', 'Software & subscriptions', 'Cloud & hosting', 'Rent & office', 'Internet & phone', 'Travel', 'Meals & entertainment', 'Office supplies & equipment', 'Professional fees (CA, legal)', 'Marketing & ads', 'Bank charges', 'GST paid', 'TDS / income tax', 'Loan repayment / EMI', 'Other expense'];
const CATS_IN = ['Client revenue (India)', 'Export revenue (foreign)', 'Interest income', 'Refund received', 'Capital introduced', 'Loan received', 'Other income'];
const KINDS = {
  business: { out: 'Business expense', in: 'Business income' },
  intercompany: { out: 'Inter-company', in: 'Inter-company' },
  transfer: { out: 'Own transfer', in: 'Own transfer' },
  personal: { out: 'Personal', in: 'Personal' },
};
const VIEWS = [['dashboard', 'Dashboard'], ['review', 'To do'], ['ledger', 'Ledger'], ['statements', 'Statements'], ['setup', 'Setup']];

const S = {
  db: null, mcp: null, assets: null, dl: null, dbState: 'loading',
  txns: new Map(), accounts: new Map(), rules: new Map(), statements: new Map(),
  settings: {}, sync: {}, seen: [],
  view: 'review', entity: 'all', reviewFilter: 'label',
  draft: {}, inv: {}, editing: null, busy: {},
  syncing: null, syncMsg: null,
  ledger: { month: 'all', q: '', kind: 'all' },
  fy: null, period: 'fy', tips: {}, stmt: { acct: null, file: null, rows: null, map: null, parsed: null, result: null, error: null },
  loaded: { txns: false, accounts: false },
};

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (p, dir) => (dir === 'out' ? '−' : dir === 'in' ? '+' : '') + P.fmtINR(Math.abs(p || 0)).replace('-', '−');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dShort = d => d ? `${+d.slice(8, 10)} ${MON[+d.slice(5, 7) - 1]}` : '';
const dLong = d => d ? `${+d.slice(8, 10)} ${MON[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}` : '';
const monthLabel = m => `${MON[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const docId = s => String(s).replace(/[^A-Za-z0-9_.~:@+-]/g, '_').slice(0, 190);
const ago = ms => { if (!ms) return 'never'; const m = Math.round((Date.now() - ms) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 36) return h + ' h ago'; return Math.round(h / 24) + ' days ago'; };
const acctName = id => { const a = S.accounts.get(id); return a ? `${BANKS[a.bank] || a.bank} ••${a.last4}` : id; };
const entityOf = t => (S.accounts.get(t.acct) || {}).entity || null;
const tracked = t => !!ENTITIES[entityOf(t)];
const inScope = t => tracked(t) && (S.entity === 'all' || entityOf(t) === S.entity);
const catsOut = () => (S.settings.catsOut && S.settings.catsOut.length ? S.settings.catsOut : CATS_OUT);
const catsIn = () => (S.settings.catsIn && S.settings.catsIn.length ? S.settings.catsIn : CATS_IN);
const needsInvoice = t => t.status === 'done' && t.kind === 'business' && t.dir === 'out' && (!t.inv || t.inv.state === 'missing');
function fyOf(d) { const y = +d.slice(0, 4), m = +d.slice(5, 7); return m >= 4 ? y : y - 1; }

async function write(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { await sleep(1200 + Math.random() * 800); return fn(); }
    throw e;
  }
}
const setDoc = (path, data) => write(() => S.db.doc(path).set(data));
const updDoc = (path, data) => write(() => S.db.doc(path).update(data));

// ---------- render loop ----------
let queued = false;
function schedule() { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; render(); }); }

function render() {
  const a = document.activeElement;
  const fid = a && a.id && a.closest('main') ? a.id : null;
  let sel = null; try { sel = fid && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null; } catch (_) {}
  $('#entity-seg').innerHTML = [['all', 'Both'], ['codecrust', 'CodeCrust'], ['aita', 'AITA']].map(([k, l]) =>
    `<button data-act="entity" data-v="${k}" aria-pressed="${S.entity === k}">${l}</button>`).join('');
  const todo = reviewCounts();
  $('#tabs').innerHTML = VIEWS.map(([k, l]) => `<a href="#${k}" ${S.view === k ? 'aria-current="page"' : ''}>${l}${k === 'review' && todo.total ? ` <span class="count">${todo.total}</span>` : ''}</a>`).join('');
  $('#synced').textContent = S.syncing ? 'Syncing…' : S.sync.lastRun ? 'Synced ' + ago(S.sync.lastRun) : '';
  const btn = $('#sync-btn'); btn.disabled = !!S.syncing || !S.mcp || !S.db; btn.textContent = S.syncing ? 'Syncing…' : 'Sync Gmail';
  let html = syncBanner();
  if (S.dbState === 'none') html += `<div class="panel empty"><h2>Open Books in claude.ai</h2><p class="muted">Your ledger is stored with this page on claude.ai, so it only loads there.</p></div>`;
  else if (S.view === 'review') html += viewReview();
  else if (S.view === 'ledger') html += viewLedger();
  else if (S.view === 'dashboard') html += viewDashboard();
  else if (S.view === 'statements') html += viewStatements();
  else html += viewSetup();
  $('#main').innerHTML = html;
  if (S.view === 'dashboard') wireCharts();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (_) {} } }
}

function syncBanner() {
  if (S.syncing) {
    const s = S.syncing; const pct = s.total ? Math.round(100 * s.done / s.total) : 0;
    return `<div class="status info" role="status"><span>${esc(s.phase)}${s.total ? ` · ${s.done} of ${s.total}` : ''}</span><span class="bar-progress"><i style="width:${pct}%"></i></span></div>`;
  }
  if (S.syncMsg) return `<div class="status ${S.syncMsg.tone}" role="status"><span>${S.syncMsg.html}</span><button class="ghost" data-act="dismiss-sync">Dismiss</button></div>`;
  return '';
}

// ---------- review ----------
function reviewCounts() {
  let label = 0, invoice = 0, stmt = 0;
  for (const t of S.txns.values()) {
    if (!inScope(t)) continue;
    if (t.status === 'todo') label++;
    else if (needsInvoice(t)) invoice++;
    if (t.recon === 'missing_in_stmt') stmt++;
  }
  return { label, invoice, stmt, total: label + invoice };
}

function balanceGapList() {
  const out = [];
  const byAcct = {};
  for (const t of S.txns.values()) if (inScope(t) && t.balPaise != null && t.ts) (byAcct[t.acct] = byAcct[t.acct] || []).push(t);
  for (const [acct, list] of Object.entries(byAcct)) for (const g of P.balanceGaps(list)) out.push({ acct, ...g });
  return out.filter(g => !(S.settings.ackGaps || []).includes(`${g.after}>${g.before}`));
}

function viewReview() {
  const c = reviewCounts();
  const unassigned = [...S.accounts.values()].filter(a => !a.entity);
  let h = '';
  for (const a of unassigned) {
    h += `<div class="status warn"><span><b>New account in your alerts: ${esc(BANKS[a.bank] || a.bank)} ••${esc(a.last4)}.</b> Whose is it?</span>
      <span class="chips">${Object.entries(ENTITIES).map(([k, l]) => `<button class="chip" data-act="assign" data-acct="${esc(a.id)}" data-v="${k}">${l}</button>`).join('')}
      <button class="chip" data-act="assign" data-acct="${esc(a.id)}" data-v="ignore">Don't track</button></span></div>`;
  }
  if (!S.loaded.txns) return h + `<div class="panel empty"><p class="muted">Loading your books…</p></div>`;
  const anyTracked = [...S.txns.values()].some(tracked);
  if (!anyTracked) {
    return h + `<div class="panel empty"><h2>No transactions yet</h2><p class="muted">Sync Gmail to read HDFC and IndusInd alert emails from ${dLong(S.settings.since || DEFAULT_SINCE)} onward. Each one lands here for you to label.</p>
      <button class="primary" data-act="sync" ${S.mcp ? '' : 'disabled'}>Sync Gmail</button>${S.mcp ? '' : '<p class="small muted">Waiting for Gmail access…</p>'}</div>`;
  }
  const gaps = balanceGapList();
  const filters = [['label', `To label`, c.label], ['invoice', 'Invoice missing', c.invoice], ['stmt', 'Not on statement', c.stmt], ['gaps', 'Balance gaps', gaps.length]];
  if (!filters.some(f => f[0] === S.reviewFilter && f[2]) && filters.some(f => f[2])) S.reviewFilter = filters.find(f => f[2])[0];
  h += `<div class="toolbar"><h2 class="grow">${c.total ? `${c.total} item${c.total === 1 ? '' : 's'} need you` : 'All caught up'}</h2></div>
    <div class="chips" role="group" aria-label="Filter">${filters.map(([k, l, n]) => `<button class="chip" data-act="rfilter" data-v="${k}" aria-pressed="${S.reviewFilter === k}">${l} · ${n}</button>`).join('')}</div>`;
  if (S.reviewFilter === 'gaps') {
    if (!gaps.length) return h + `<div class="panel empty"><p class="muted">IndusInd alerts include the balance after each transaction. Every balance so far follows from the one before it, so no transaction is missing.</p></div>`;
    return h + `<div class="list">${gaps.map(g => `<div class="card"><div class="r1"><div class="who">${acctName(g.acct)}: ${money(Math.abs(g.missingPaise), g.missingPaise < 0 ? 'out' : 'in')} unaccounted
      <span class="sub">Between ${dLong(g.from)} and ${dLong(g.to)} the balance moved by more than the alerts explain. A transaction without an email alert happened in between (often a charge, cheque or NEFT). Import that month's statement to fill it in.</span></div></div>
      <div class="actions"><button data-act="ack-gap" data-v="${esc(g.after + '>' + g.before)}">Mark as explained</button></div></div>`).join('')}</div>`;
  }
  const list = [...S.txns.values()].filter(inScope).filter(t =>
    S.reviewFilter === 'label' ? t.status === 'todo' : S.reviewFilter === 'invoice' ? needsInvoice(t) : t.recon === 'missing_in_stmt'
  ).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.ts || 0) - (a.ts || 0));
  if (!list.length) return h + `<div class="panel empty"><p class="muted">Nothing here.</p></div>`;
  const shown = list.slice(0, 40);
  return h + `<div class="list">${shown.map(t => card(t)).join('')}</div>${list.length > shown.length ? `<p class="muted small">Showing the newest 40 of ${list.length}. Save a few to load more.</p>` : ''}`;
}

function draftFor(t) {
  if (!S.draft[t.id]) S.draft[t.id] = { kind: t.kind || null, cat: t.cat || '', note: t.note || '', remember: false };
  return S.draft[t.id];
}

function card(t, opts = {}) {
  const d = draftFor(t);
  const ent = ENTITIES[entityOf(t)] || 'Unassigned';
  const sub = [t.vpa, t.mode && t.ref ? `${t.mode} ${t.ref}` : t.ref, t.narr && !t.vpa ? t.narr : null].filter(Boolean).map(esc).join(' · ');
  const tags = [];
  if (t.recon === 'stmt_only') tags.push('<span class="tag warn">No alert · from statement</span>');
  if (t.recon === 'missing_in_stmt') tags.push('<span class="tag crit">Not on statement</span>');
  if (t.recon === 'matched') tags.push('<span class="tag good">On statement</span>');
  if (t.auto) tags.push('<span class="tag">Auto-labelled</span>');
  if (t.pairId) tags.push('<span class="tag">Matched pair</span>');
  if (t.review) tags.push(`<span class="tag warn">${esc(t.review)}</span>`);
  const kindBtns = Object.keys(KINDS).map(k => `<button class="chip" data-act="kind" data-id="${esc(t.id)}" data-v="${k}" aria-pressed="${d.kind === k}">${KINDS[k][t.dir]}</button>`).join('');
  const cats = t.dir === 'out' ? catsOut() : catsIn();
  const catSel = d.kind === 'business' ? `<select id="cat-${esc(t.id)}" data-field="cat" data-id="${esc(t.id)}" aria-label="Category"><option value="">Category…</option>${cats.map(c => `<option ${d.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>` : '';
  const pk = P.partyKey(t);
  const err = S.busy['err-' + t.id];
  const mailLink = (t.mails || []).find(m => m.url);
  return `<article class="card" id="card-${esc(t.id)}">
    <div class="r1"><div class="meta">${dLong(t.date)} · ${esc(acctName(t.acct))} · ${esc(ent)}</div>
      <div class="amt"><span class="dot ${t.dir}"></span><span class="num">${money(t.paise, t.dir)}</span></div></div>
    <div class="who">${esc(t.party || t.vpa || t.stmtNarr || t.narr || 'Unknown payee')}${sub && (t.party || t.vpa) ? `<span class="sub">${sub}</span>` : ''}</div>
    ${tags.length ? `<div class="chips">${tags.join('')}</div>` : ''}
    ${t.suggest && t.status === 'todo' ? `<div class="suggest"><span>Suggested: <b>${esc(t.suggest.kind === 'business' ? t.suggest.cat : KINDS[t.suggest.kind][t.dir])}</b>${t.suggest.why ? ` <span class="muted">· ${esc(t.suggest.why)}</span>` : ''}</span><button class="ghost" data-act="use-suggest" data-id="${esc(t.id)}">Use this</button></div>` : ''}
    <div class="kinds" role="group" aria-label="What is this">${kindBtns}</div>
    <div class="fields">${catSel}
      <input type="text" id="note-${esc(t.id)}" data-field="note" data-id="${esc(t.id)}" value="${esc(d.note)}" placeholder="What was it for? (client, project, item)" aria-label="Note">
      ${pk ? `<label class="check"><input type="checkbox" id="rem-${esc(t.id)}" data-field="remember" data-id="${esc(t.id)}" ${d.remember ? 'checked' : ''}> Same for future ${esc(t.party || t.vpa)}</label>` : ''}
    </div>
    ${invoiceBlock(t, d)}
    <div class="actions"><button class="primary" data-act="save" data-id="${esc(t.id)}" ${S.busy[t.id] ? 'disabled' : ''}>${t.status === 'done' ? 'Update' : 'Save'}</button>
      ${opts.close ? `<button data-act="close-edit">Close</button>` : ''}
      ${mailLink ? `<a class="btn ghost" href="${esc(mailLink.url)}" target="_blank" rel="noopener">Alert email ↗</a>` : ''}
      ${err ? `<span class="err">${esc(err)}</span>` : ''}</div>
  </article>`;
}

function invoiceBlock(t, d) {
  const kind = d.kind || t.kind;
  if (kind !== 'business') return '';
  const inv = t.inv || { state: 'missing', items: [] };
  const st = S.inv[t.id] || {};
  const need = t.dir === 'out';
  const label = need ? (inv.state === 'attached' ? 'Invoice attached' : inv.state === 'not_needed' ? 'No invoice needed' : 'Invoice or bill needed') : (inv.state === 'attached' ? 'Invoice attached' : 'Your invoice to the client (optional)');
  const items = (inv.items || []).map((it, i) => `<div class="att">${it.type === 'gmail'
      ? `<span>✉</span><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.subject || '(no subject)')}</a><span class="muted">${esc(it.from || '')}</span>`
      : `<span>📎</span><a href="/_blob/${esc(it.id)}" target="_blank" rel="noopener">${esc(it.name || 'file')}</a>`}
      <button class="ghost" data-act="inv-remove" data-id="${esc(t.id)}" data-v="${i}" aria-label="Remove">Remove</button></div>`).join('');
  let res = '';
  if (st.open) {
    res = `<div class="qrow"><input type="text" id="invq-${esc(t.id)}" data-field="invq" data-id="${esc(t.id)}" value="${esc(st.q || '')}" aria-label="Gmail search">
      <button data-act="inv-search" data-id="${esc(t.id)}" ${st.loading ? 'disabled' : ''}>${st.loading ? 'Searching…' : 'Search'}</button>
      <button class="ghost" data-act="inv-mode" data-id="${esc(t.id)}">${st.mode === 'party' ? 'Search by amount' : 'Search by payee name'}</button></div>`;
    if (st.error) res += `<p class="err">${esc(st.error)}</p>`;
    else if (st.results && !st.results.length) res += `<p class="small muted">No matching emails between a week before and four days after the payment. Try the payee name, or upload the bill.</p>`;
    else if (st.results) res += `<div class="results">${st.results.map((r, i) => `<div class="res"><span class="s">${r.ai ? '<span class="tag good">Best match</span> ' : ''}${esc(r.subject || '(no subject)')}${r.reason ? ` <span class="muted">· ${esc(r.reason)}</span>` : ''}</span>
      <span class="f">${esc(r.from)} · ${esc(r.date ? dShort(r.date.slice(0, 10)) : '')}${r.snippet ? ' · ' + esc(r.snippet.slice(0, 110)) : ''}</span>
      <button data-act="inv-attach" data-id="${esc(t.id)}" data-v="${i}">Attach</button></div>`).join('')}</div>`;
  }
  return `<div class="inv"><div class="head"><span class="label">${label}</span>
      <button data-act="inv-find" data-id="${esc(t.id)}" ${S.mcp ? '' : 'disabled'}>Find in Gmail</button>
      ${S.assets ? `<label class="btn" for="up-${esc(t.id)}">Upload</label><input type="file" id="up-${esc(t.id)}" data-field="upload" data-id="${esc(t.id)}" accept="application/pdf,image/png,image/jpeg,image/webp" hidden>` : ''}
      ${need && inv.state !== 'not_needed' && !(inv.items || []).length ? `<button class="ghost" data-act="inv-none" data-id="${esc(t.id)}">Not needed</button>` : ''}
    </div>${items}${res}</div>`;
}

// ---------- ledger ----------
function ledgerRows() {
  const L = S.ledger;
  const q = L.q.trim().toLowerCase();
  return [...S.txns.values()].filter(inScope).filter(t =>
    (L.month === 'all' || (t.date || '').startsWith(L.month)) &&
    (L.kind === 'all' || (L.kind === 'todo' ? t.status === 'todo' : t.kind === L.kind)) &&
    (!q || [t.party, t.vpa, t.narr, t.cat, t.note, t.ref].join(' ').toLowerCase().includes(q))
  ).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.ts || 0) - (a.ts || 0));
}

function viewLedger() {

  const rows = ledgerRows();
  let inP = 0, outP = 0; rows.forEach(t => { if (t.dir === 'in') inP += t.paise; else outP += t.paise; });

  <div class="toolbar">
    <select id="lg-month" data-field="lg-month" aria-label="Month"><option value="all">All months</option>${months.map(m => `<option value="${m}" ${S.ledger.month === m ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}</select>
    <select id="lg-kind" data-field="lg-kind" aria-label="Type"><option value="all">All types</option><option value="todo" ${S.ledger.kind === 'todo' ? 'selected' : ''}>Not labelled</option>${Object.keys(KINDS).map(k => `<option value="${k}" ${S.ledger.kind === k ? 'selected' : ''}>${KINDS[k].out.replace(' expense', '')}</option>`).join('')}</select>
    <input type="text" class="grow" id="lg-q" data-field="lg-q" value="${esc(S.ledger.q)}" placeholder="Search payee, note, reference" aria-label="Search">

  <div class="panel tablewrap" style="padding:0">${rows.length ? `<table><thead><tr><th>Date</th><th>Account</th><th>Payee / payer</th><th>Category</th><th class="r">In</th><th class="r">Out</th><th>Invoice</th><th>Statement</th></tr></thead><tbody>
    ${rows.slice(0, 500).map(t => `<tr class="click" data-act="edit" data-id="${esc(t.id)}" tabindex="0">
      <td class="num">${dShort(t.date)}</td><td>${esc(acctName(t.acct))}</td>
      <td class="party">${esc(t.party || t.vpa || t.narr || '')}${t.note ? `<div class="muted small">${esc(t.note)}</div>` : ''}</td>
      <td>${t.status === 'todo' ? '<span class="tag warn">To label</span>' : esc(t.kind === 'business' ? t.cat || '—' : KINDS[t.kind] ? KINDS[t.kind][t.dir] : '—')}</td>
      <td class="r num">${t.dir === 'in' ? P.fmtINR(t.paise) : ''}</td><td class="r num">${t.dir === 'out' ? P.fmtINR(t.paise) : ''}</td>
      <td>${t.inv && t.inv.state === 'attached' ? '<span class="tag good">Yes</span>' : needsInvoice(t) ? '<span class="tag crit">Missing</span>' : t.inv && t.inv.state === 'not_needed' ? '<span class="tag">n/a</span>' : ''}</td>
      <td>${t.recon === 'matched' ? '<span class="tag good">Matched</span>' : t.recon === 'stmt_only' ? '<span class="tag warn">Stmt only</span>' : t.recon === 'missing_in_stmt' ? '<span class="tag crit">Missing</span>' : '<span class="muted small">Pending</span>'}</td></tr>`).join('')}
  </tbody></table>${rows.length > 500 ? `<p class="small muted" style="padding:8px">Showing 500 of ${rows.length}. Narrow by month.</p>` : ''}` : `<div class="empty"><p class="muted">No transactions match.</p></div>`}</div>`;
}

function exportCsv() {
  const rows = ledgerRows().slice().reverse();
  const head = ['Date', 'Company', 'Bank account', 'Direction', 'Amount', 'Payee/payer', 'UPI/VPA', 'Mode', 'Reference', 'Type', 'Category', 'Note', 'Invoice', 'Invoice links', 'Statement', 'Bank narration'];
  const q = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [head.join(',')].concat(rows.map(t => [t.date, ENTITIES[entityOf(t)], acctName(t.acct), t.dir === 'in' ? 'In' : 'Out', (t.paise / 100).toFixed(2), t.party, t.vpa, t.mode, t.ref,
    t.kind ? KINDS[t.kind][t.dir] : 'Not labelled', t.cat, t.note, t.inv ? t.inv.state : '', (t.inv && t.inv.items || []).map(i => i.url || i.name).join(' | '), t.recon || 'pending', t.stmtNarr || t.narr].map(q).join(',')));
  const name = `books-${S.entity === 'all' ? 'both' : S.entity}-${S.ledger.month === 'all' ? 'all' : S.ledger.month}.csv`;
  S.dl.save({ filename: name, data: lines.join('\n') }).catch(e => { if (e && e.code !== 'cancelled') flash('crit', 'Could not save the file: ' + esc(e.message || e.code)); });
}

// ---------- dashboard ----------
const ENT_VAR = { codecrust: 'e1', aita: 'e2' };
function fyMonths(fy) { const out = []; for (let i = 0; i < 12; i++) { const m = ((i + 3) % 12) + 1; out.push(`${m < 4 ? fy + 1 : fy}-${String(m).padStart(2, '0')}`); } return out; }
function prevMonth(m) { const y = +m.slice(0, 4), mo = +m.slice(5, 7); return mo === 1 ? `${y - 1}-12` : `${y}-${String(mo - 1).padStart(2, '0')}`; }
function monthEnd(m) { const y = +m.slice(0, 4), mo = +m.slice(5, 7); return `${m}-${String(new Date(Date.UTC(y, mo, 0)).getUTCDate()).padStart(2, '0')}`; }
function periodLabel() { return S.period === 'fy' ? `FY ${S.fy}–${String(S.fy + 1).slice(2)}` : monthLabel(S.period); }

// Totals for a set of txns. Own transfers never count; inter-company nets out when both companies are shown.
function flows(list, both) {
  const r = { in: 0, out: 0, biz: 0, pers: 0, unl: 0, unlN: 0, ic: 0 };
  for (const t of list) {
    if (t.kind === 'transfer' || (both && t.kind === 'intercompany')) continue;
    if (t.dir === 'in') r.in += t.paise; else r.out += t.paise;
    if (t.dir === 'out') {
      if (t.status === 'todo') { r.unl += t.paise; r.unlN++; }
      else if (t.kind === 'business') r.biz += t.paise;
      else if (t.kind === 'personal') r.pers += t.paise;
    }
    if (t.kind === 'intercompany') r.ic += t.dir === 'in' ? t.paise : -t.paise;
  }
  r.net = r.in - r.out;
  return r;
}
function delta(cur, prev, label) {
  if (!prev) return '<span class="delta">&nbsp;</span>';
  const d = Math.round(100 * (cur - prev) / Math.abs(prev));
  return `<span class="delta">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}% vs ${esc(label)}</span>`;
}
function latestBalance(acctId) {
  let best = null;
  for (const t of S.txns.values()) {
    if (t.acct !== acctId) continue;
    const b = t.balPaise != null ? t.balPaise : t.stmtBal != null ? t.stmtBal : null;
    if (b == null) continue;
    const key = (t.date || '') + String(t.ts || 0).padStart(15, '0');
    if (!best || key > best.key) best = { key, b, date: t.date };
  }
  return best;
}
function balanceSeries(acctId, from, to) {
  const pts = [];
  for (const t of S.txns.values()) {
    if (t.acct !== acctId || !t.date) continue;
    const b = t.balPaise != null ? t.balPaise : t.stmtBal != null ? t.stmtBal : null;
    if (b != null) pts.push({ date: t.date, k: (t.date || '') + String(t.ts || 0).padStart(15, '0'), b });
  }
  pts.sort((a, b) => a.k < b.k ? -1 : 1);
  const byDay = new Map(); for (const p of pts) byDay.set(p.date, p.b); // last balance of each day
  const days = [...byDay.entries()].map(([date, b]) => ({ date, b }));
  const before = days.filter(p => p.date < from).pop();
  const inside = days.filter(p => p.date >= from && p.date <= to);
  return before ? [{ date: from, b: before.b }].concat(inside) : inside;
}

function viewDashboard() {
  if (!S.loaded.txns) return `<div class="panel empty"><p class="muted">Loading your books…</p></div>`;
  const all = [...S.txns.values()].filter(inScope).filter(t => t.date);
  if (!all.length) return `<div class="panel empty"><h2>Your dashboard fills in after the first sync</h2><p class="muted">Sync Gmail to pull HDFC and IndusInd alerts from ${dLong(S.settings.since || DEFAULT_SINCE)} onward.</p><button class="primary" data-act="sync" ${S.mcp ? '' : 'disabled'}>Sync Gmail</button></div>`;
  const both = S.entity === 'all';
  const fys = [...new Set(all.map(t => fyOf(t.date)))].sort().reverse();
  if (!S.fy || !fys.includes(S.fy)) S.fy = fys[0];
  const months = fyMonths(S.fy);
  const nowM = P.istDate(Date.now()).slice(0, 7);
  const liveMonths = months.filter(m => m <= nowM || all.some(t => t.date.startsWith(m)));
  if (S.period !== 'fy' && !months.includes(S.period)) S.period = 'fy';
  const inP = t => S.period === 'fy' ? fyOf(t.date) === S.fy : t.date.startsWith(S.period);
  const list = all.filter(inP);
  const f = flows(list, both);
  let prev = null, prevLabel = '';
  if (S.period === 'fy') { const pl = all.filter(t => fyOf(t.date) === S.fy - 1); if (pl.length) { prev = flows(pl, both); prevLabel = 'last FY'; } }
  else { const pm = prevMonth(S.period); const pl = all.filter(t => t.date.startsWith(pm)); if (pl.length) { prev = flows(pl, both); prevLabel = MON[+pm.slice(5) - 1]; } }
  const from = S.period === 'fy' ? `${S.fy}-04-01` : `${S.period}-01`;
  const to = S.period === 'fy' ? `${S.fy + 1}-03-31` : monthEnd(S.period);
  const title = both ? 'Both companies' : ENTITIES[S.entity];
  const periodSel = `<select id="period" data-field="period" aria-label="Period">${fys.map(y => `<optgroup label="FY ${y}–${String(y + 1).slice(2)}"><option value="fy:${y}" ${S.period === 'fy' && S.fy === y ? 'selected' : ''}>Whole year</option>${fyMonths(y).filter(m => m <= nowM || all.some(t => t.date.startsWith(m))).reverse().map(m => `<option value="m:${m}" ${S.period === m ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}</optgroup>`).join('')}</select>`;

  // Tiles
  const tile = (k, v, extra = '', dot = '') => `<div class="tile"><div class="k">${dot}${k}</div><div class="v">${v}</div>${extra}</div>`;
  let h = `<div class="toolbar"><h2 class="grow">${esc(title)} · ${periodLabel()}</h2>${periodSel}</div>
  <div class="tiles">
    ${tile('Money in', P.fmtINR(f.in), delta(f.in, prev && prev.in, prevLabel), '<span class="dot in"></span>')}
    ${tile('Money out', P.fmtINR(f.out), delta(f.out, prev && prev.out, prevLabel), '<span class="dot out"></span>')}
    ${tile('Net', P.fmtINR(f.net), delta(f.net, prev && prev.net, prevLabel))}
    ${tile('Business expenses', P.fmtINR(f.biz), `<span class="delta">${f.pers ? `Personal spends ${P.fmtINR(f.pers)}` : 'No personal spends'}</span>`)}
  </div>`;
  if (f.unlN) h += `<div class="status warn"><span><b>${f.unlN}</b> outgoing payment${f.unlN === 1 ? '' : 's'} (${P.fmtINR(f.unl)}) in this period aren't labelled yet, so the expense figures are incomplete.</span><a class="btn" href="#review">Label them</a></div>`;

  // Bank balances
  const accts = [...S.accounts.values()].filter(a => ENTITIES[a.entity] && (both || a.entity === S.entity)).sort((a, b) => a.entity.localeCompare(b.entity));
  h += `<div class="tiles">${accts.map(a => { const lb = latestBalance(a.id);
    return `<div class="tile"><div class="k"><span class="dot ${ENT_VAR[a.entity]}"></span>${esc(ENTITIES[a.entity])} · ${esc(acctName(a.id))}</div>
      <div class="v">${lb ? P.fmtINR(lb.b) : '—'}</div><span class="delta">${lb ? `Balance as of ${dLong(lb.date)}` : 'No balance yet. Import a statement.'}</span></div>`; }).join('')}</div>`;

  // Cash flow by month + needs attention
  const monthly = liveMonths.map(m => { const r = flows(all.filter(t => t.date.startsWith(m)), both); return { key: m, in: r.in, out: r.out, net: r.net }; });
  const cnt = reviewCounts(); const gaps = balanceGapList();
  const lastMonth = prevMonth(nowM);
  const noStmt = accts.filter(a => ![...S.statements.values()].some(s => s.acct === a.id && s.to >= monthEnd(lastMonth).slice(0, 8) + '25'));
  const health = [[cnt.label, 'transactions to label'], [cnt.invoice, 'business expenses without an invoice'], [cnt.stmt, 'alerts not found on a statement'], [gaps.length, 'IndusInd balance gaps'], [noStmt.length, `${monthLabel(lastMonth)} statement${noStmt.length === 1 ? '' : 's'} not imported`]];
  h += `<div class="grid2">
    <div class="panel"><div class="toolbar"><h3 class="grow">Cash flow by month · FY ${S.fy}–${String(S.fy + 1).slice(2)}</h3>
      <div class="legend"><span><span class="dot in"></span>In</span><span><span class="dot out"></span>Out</span><span><span class="dot net"></span>Net</span></div></div>
      ${chartBox('cash', cashChart(monthly))}</div>
    <div class="panel"><h3>Needs attention</h3><ul class="plain health">${health.map(([n, l]) => `<li><span class="tag ${n ? 'warn' : 'good'} num">${n}</span><a href="#${/statement/.test(l) && !/alerts/.test(l) ? 'statements' : 'review'}">${l}</a></li>`).join('')}</ul>
      ${(() => { const out = list.filter(t => t.dir === 'out' && t.kind === 'business'); const need = out.filter(t => !t.inv || t.inv.state !== 'not_needed'); const has = need.filter(t => t.inv && t.inv.state === 'attached');
        const lab = list.filter(t => t.status !== 'todo').length;
        return `<div class="meters">${meter('Labelled', list.length ? lab / list.length : 1, `${lab} of ${list.length}`)}${meter('Expenses with invoice', need.length ? has.length / need.length : 1, `${has.length} of ${need.length}`)}</div>`; })()}
    </div></div>`;

  // Categories + balance trend
  const byCat = {};
  for (const t of list) {
    if (t.dir !== 'out' || t.kind === 'transfer' || (both && t.kind === 'intercompany')) continue;
    const k = t.status === 'todo' ? 'Not labelled yet' : t.kind === 'business' ? (t.cat || 'Uncategorised') : KINDS[t.kind].out;
    byCat[k] = (byCat[k] || 0) + t.paise;
  }
  let cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  if (cats.length > 8) { const rest = cats.slice(7).reduce((s, c) => s + c[1], 0); cats = cats.slice(0, 7).concat([['Everything else', rest]]); }
  const maxCat = Math.max(1, ...cats.map(c => c[1]));
  const series = accts.map(a => ({ id: a.id, label: `${ENTITIES[a.entity]} ${acctName(a.id)}`, cls: ENT_VAR[a.entity], pts: balanceSeries(a.id, from, to) })).filter(s => s.pts.length);
  h += `<div class="grid2">
    <div class="panel"><h3>Where the money went</h3>${cats.length ? `<div class="hbars">${cats.map(([k, p]) => `<div class="hbar"><span class="l">${esc(k)}</span><span class="track"><i style="width:${Math.max(1, 100 * p / maxCat)}%"></i></span><span class="a num">${P.fmtINR(p)}</span><span class="s num">${f.out ? Math.round(100 * p / f.out) : 0}%</span></div>`).join('')}</div>` : '<p class="muted">No money out in this period.</p>'}</div>
    <div class="panel"><div class="toolbar"><h3 class="grow">Bank balance</h3><div class="legend">${series.map(s => `<span><span class="dot ${s.cls}"></span>${esc(s.label)}</span>`).join('')}</div></div>
      ${series.length ? chartBox('bal', balChart(series, from, to)) : '<p class="muted small">IndusInd alerts carry the balance; HDFC alerts don\'t. HDFC balances appear here once you import a statement.</p>'}</div>
  </div>`;

  // Company split
  if (both) {
    h += `<div class="panel tablewrap"><h3>By company · ${periodLabel()}</h3><table><thead><tr><th>Company</th><th class="r">In</th><th class="r">Out</th><th class="r">Net</th><th class="r">Inter-company net</th><th class="r">To label</th><th class="r">Missing invoices</th></tr></thead><tbody>
      ${Object.entries(ENTITIES).map(([k, name]) => { const l = list.filter(t => entityOf(t) === k); const r = flows(l, false);
        return `<tr><td><span class="dot ${ENT_VAR[k]}"></span> ${esc(name)}</td><td class="r num">${P.fmtINR(r.in)}</td><td class="r num">${P.fmtINR(r.out)}</td><td class="r num">${P.fmtINR(r.net)}</td><td class="r num">${P.fmtINR(r.ic)}</td><td class="r num">${l.filter(t => t.status === 'todo').length}</td><td class="r num">${l.filter(needsInvoice).length}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  }

  // Top payees / payers
  const top = dir => { const g = {}; for (const t of list) { if (t.dir !== dir || t.kind === 'transfer') continue; const k = P.partyKey(t) || t.narr || '?'; const e = g[k] = g[k] || { label: t.party || t.vpa || t.stmtNarr || t.narr || 'Unknown', p: 0, n: 0 }; e.p += t.paise; e.n++; } return Object.values(g).sort((a, b) => b.p - a.p).slice(0, 6); };
  const topTable = (rows, empty) => rows.length ? `<table><tbody>${rows.map(r => `<tr><td class="party">${esc(r.label)}</td><td class="r num muted">${r.n}×</td><td class="r num">${P.fmtINR(r.p)}</td></tr>`).join('')}</tbody></table>` : `<p class="muted">${empty}</p>`;
  h += `<div class="grid2"><div class="panel tablewrap"><h3>Paid most to</h3>${topTable(top('out'), 'No payments in this period.')}</div>
    <div class="panel tablewrap"><h3>Received most from</h3>${topTable(top('in'), 'Nothing received in this period.')}</div></div>`;

  // Statement coverage
  const covered = (a, m) => [...S.statements.values()].some(s => s.acct === a.id && s.from <= `${m}-03` && s.to >= `${monthEnd(m).slice(0, 8)}${String(+monthEnd(m).slice(8) - 3).padStart(2, '0')}`);
  const covMonths = liveMonths.filter(m => m <= nowM);
  h += `<div class="panel tablewrap"><h3>Statements reconciled</h3><table class="cov"><thead><tr><th>Account</th>${covMonths.map(m => `<th>${MON[+m.slice(5) - 1]}</th>`).join('')}</tr></thead><tbody>
    ${accts.map(a => `<tr><td>${esc(acctName(a.id))}</td>${covMonths.map(m => { const c = covered(a, m); const any = [...S.txns.values()].some(t => t.acct === a.id && (t.date || '').startsWith(m));
      return `<td>${c ? '<span class="tag good" title="Statement imported and matched">✓</span>' : any ? '<span class="tag warn" title="Alerts only: import this month\'s statement">Alerts</span>' : '<span class="muted">·</span>'}</td>`; }).join('')}</tr>`).join('')}
  </tbody></table><p class="small muted">✓ statement imported and matched · Alerts = only email alerts so far, so charges and cheques may be missing.</p></div>`;

  // Recent
  const recent = list.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.ts || 0) - (a.ts || 0)).slice(0, 8);
  h += `<div class="panel tablewrap"><div class="toolbar"><h3 class="grow">Latest transactions</h3><a href="#ledger">Open ledger</a></div><table><tbody>${recent.map(t => `<tr class="click" data-act="open-txn" data-id="${esc(t.id)}" tabindex="0"><td class="num">${dShort(t.date)}</td><td class="party">${esc(t.party || t.vpa || t.stmtNarr || t.narr || '')}<div class="muted small">${esc(acctName(t.acct))}${t.status === 'todo' ? ' · to label' : t.kind === 'business' ? ' · ' + esc(t.cat || '') : t.kind ? ' · ' + esc(KINDS[t.kind][t.dir]) : ''}</div></td><td class="r"><span class="amt small-amt"><span class="dot ${t.dir}"></span><span class="num">${money(t.paise, t.dir)}</span></span></td></tr>`).join('')}</tbody></table></div>
  <p class="small muted">Own transfers are left out of totals${both ? ', and so is money moving between CodeCrust and AITA, because it cancels out' : ''}. Figures cover email alerts plus imported statements.</p>`;
  return h;
}

function meter(label, frac, text) {
  const pct = Math.round(100 * frac);
  return `<div class="meter"><div class="toolbar"><span class="grow small">${label}</span><span class="num small">${pct}% · ${text}</span></div><div class="bar-progress"><i style="width:${pct}%"></i></div></div>`;
}

// ---------- charts ----------
const CH = { W: 560, H: 230, L: 62, R: 10, T: 12, B: 26 };
function chartBox(id, svg) { return `<div class="chart" data-chart="${id}">${svg}<div class="tip" hidden></div></div>`; }
function niceStep(raw) { if (raw <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function shortINR(p) { const r = Math.abs(p) / 100, s = p < 0 ? '−' : ''; if (r >= 1e7) return s + '₹' + +(r / 1e7).toFixed(1) + 'Cr'; if (r >= 1e5) return s + '₹' + +(r / 1e5).toFixed(1) + 'L'; if (r >= 1e3) return s + '₹' + +(r / 1e3).toFixed(0) + 'k'; return s + '₹' + Math.round(r); }
function yScale(lo, hi) {
  const step = niceStep((hi - lo) / 4 || 1); const min = Math.floor(lo / step) * step, max = Math.ceil(hi / step) * step || step;
  const { H, T, B } = CH; const y = v => T + (H - T - B) * (1 - (v - min) / (max - min || 1));
  const ticks = []; for (let v = min; v <= max + step / 2; v += step) ticks.push(v);
  return { y, ticks };
}
function grid(ys) { const { L, W, R } = CH; return ys.ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${ys.y(v)}" y2="${ys.y(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.5 : 1}"/><text x="${L - 6}" y="${ys.y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${shortINR(v)}</text>`).join(''); }
function roundBar(x, y0, y1, w) { const top = Math.min(y0, y1), h = Math.abs(y1 - y0); if (h < 0.5) return ''; const r = Math.min(4, w / 2, h); return `M${x},${top + h}V${top + r}Q${x},${top} ${x + r},${top}H${x + w - r}Q${x + w},${top} ${x + w},${top + r}V${top + h}Z`; }

function cashChart(months) {
  const { W, H, L, R, T, B } = CH;
  const lo = Math.min(0, ...months.map(m => m.net)), hi = Math.max(1, ...months.map(m => Math.max(m.in, m.out, m.net)));
  const ys = yScale(lo, hi); const y = ys.y;
  const bw = (W - L - R) / Math.max(months.length, 1), w = Math.max(3, Math.min(18, (bw - 10) / 2));
  let g = grid(ys);
  const tips = [];
  months.forEach((m, i) => {
    const cx = L + i * bw + bw / 2;
    g += `<path d="${roundBar(cx - w - 1, y(0), y(m.in), w)}" fill="var(--in)"/><path d="${roundBar(cx + 1, y(0), y(m.out), w)}" fill="var(--out)"/>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${MON[+m.key.slice(5) - 1]}</text>`;
    tips.push(`<b>${monthLabel(m.key)}</b><br>In ${P.fmtINR(m.in)}<br>Out ${P.fmtINR(m.out)}<br>Net ${P.fmtINR(m.net)}`);
  });
  if (months.length > 1) g += `<polyline points="${months.map((m, i) => `${L + i * bw + bw / 2},${y(m.net)}`).join(' ')}" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linejoin="round"/>`;
  g += months.map((m, i) => `<circle cx="${L + i * bw + bw / 2}" cy="${y(m.net)}" r="4" fill="var(--ink2)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  g += months.map((m, i) => `<rect class="hit" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>`).join('');
  S.tips.cash = { kind: 'bars', tips };
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in, money out and net by month">${g}</svg>`;
}

function balChart(series, from, to) {
  const { W, H, L, R, T, B } = CH;
  const x0 = Date.parse(from), x1 = Date.parse(to);
  const x = d => L + (W - L - R) * (Date.parse(d) - x0) / Math.max(1, x1 - x0);
  const vals = series.flatMap(s => s.pts.map(p => p.b));
  const lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.1 || Math.abs(hi) * 0.1 || 100;
  const ys = yScale(Math.max(0, lo - pad), hi + pad); const y = ys.y;
  let g = grid(ys);
  // x ticks: month starts across a year, weeks inside a month
  const ticks = [];
  if (x1 - x0 > 40 * 86400000) { for (let d = new Date(x0); d <= x1; d.setUTCMonth(d.getUTCMonth() + 1)) ticks.push([d.toISOString().slice(0, 10), MON[d.getUTCMonth()]]); }
  else for (const day of [1, 8, 15, 22, 29]) { const d = from.slice(0, 8) + String(day).padStart(2, '0'); if (d <= to) ticks.push([d, `${day} ${MON[+from.slice(5, 7) - 1]}`]); }
  g += ticks.map(([d, l]) => `<text x="${x(d)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${l}</text>`).join('');
  for (const s of series) {
    let d = `M${x(s.pts[0].date)},${y(s.pts[0].b)}`;
    for (let i = 1; i < s.pts.length; i++) d += `H${x(s.pts[i].date)}V${y(s.pts[i].b)}`;
    g += `<path d="${d}" fill="none" stroke="var(--${s.cls})" stroke-width="2" stroke-linejoin="round"/>`;
    const last = s.pts[s.pts.length - 1];
    g += `<circle cx="${x(last.date)}" cy="${y(last.b)}" r="4" fill="var(--${s.cls})" stroke="var(--surface)" stroke-width="2"/>`;
  }
  g += `<line class="xhair" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  g += `<rect class="hit-line" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
  S.tips.bal = { kind: 'line', x0, x1, series };
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bank balance over time">${g}</svg>`;
}

function wireCharts() {
  document.querySelectorAll('.chart[data-chart]').forEach(box => {
    const id = box.dataset.chart, spec = S.tips[id], tip = box.querySelector('.tip'), svg = box.querySelector('svg');
    if (!spec || !svg) return;
    const place = (px) => { const bw = box.getBoundingClientRect().width; tip.style.left = Math.min(Math.max(70, px), bw - 70) + 'px'; tip.style.top = '36px'; tip.hidden = false; };
    if (spec.kind === 'bars') {
      box.querySelectorAll('.hit').forEach(el => {
        const show = () => { tip.innerHTML = spec.tips[+el.dataset.i]; const r = el.getBoundingClientRect(), b = box.getBoundingClientRect(); place(r.left - b.left + r.width / 2); };
        el.addEventListener('mouseenter', show); el.addEventListener('click', show);
      });
    } else {
      const hit = box.querySelector('.hit-line'), xh = box.querySelector('.xhair');
      const move = ev => {
        const b = svg.getBoundingClientRect(); const sx = (ev.clientX - b.left) * CH.W / b.width;
        const frac = Math.min(1, Math.max(0, (sx - CH.L) / (CH.W - CH.L - CH.R)));
        const date = new Date(spec.x0 + frac * (spec.x1 - spec.x0)).toISOString().slice(0, 10);
        const lastDate = spec.series.reduce((m, s) => s.pts[s.pts.length - 1].date > m ? s.pts[s.pts.length - 1].date : m, '');
        if (date > lastDate) { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); return; }
        const rows = spec.series.map(s => { const p = s.pts.filter(q => q.date <= date).pop(); return p ? `<span class="dot ${s.cls}"></span> ${esc(s.label)}: ${P.fmtINR(p.b)}` : ''; }).filter(Boolean);
        if (!rows.length) { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); return; }
        xh.setAttribute('x1', sx); xh.setAttribute('x2', sx); xh.setAttribute('visibility', 'visible');
        tip.innerHTML = `<b>${dLong(date)}</b><br>${rows.join('<br>')}`; place(ev.clientX - box.getBoundingClientRect().left);
      };
      hit.addEventListener('mousemove', move); hit.addEventListener('click', move);
      hit.addEventListener('mouseleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
    }
    box.addEventListener('mouseleave', () => { tip.hidden = true; });
  });
}

// ---------- statements ----------
function viewStatements() {
  const accts = [...S.accounts.values()].filter(a => ENTITIES[a.entity] && (S.entity === 'all' || a.entity === S.entity));
  if (!accts.length) return `<div class="panel empty"><h2>No accounts yet</h2><p class="muted">Sync Gmail first. Accounts are picked up from the alert emails.</p></div>`;
  const st = S.stmt; if (!st.acct || !accts.some(a => a.id === st.acct)) st.acct = accts[0].id;
  const done = [...S.statements.values()].filter(s => s.acct === st.acct).sort((a, b) => (b.to || '').localeCompare(a.to || ''));
  let imp = `<div class="panel"><h3>Import a statement</h3>
    <p class="small muted">Download the statement for this account from net banking as Excel (.xls / .xlsx) or CSV, then pick the file here. Books matches every row to your alerts, adds the rows that had no alert, and flags alerts that never reached the bank. ${window.BOOKS_LOCAL ? 'PDF statements work too: they are read by AI and every row is balance-checked.' : 'PDF statements are only read by the local app.'}</p>
    <div class="toolbar"><select id="st-acct" data-field="st-acct" aria-label="Account">${accts.map(a => `<option value="${esc(a.id)}" ${a.id === st.acct ? 'selected' : ''}>${esc(acctName(a.id))} · ${ENTITIES[a.entity]}</option>`).join('')}</select>
    <input type="file" id="st-file" data-field="st-file" accept=".xls,.xlsx,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet${window.BOOKS_LOCAL ? ',.pdf,application/pdf' : ''}"></div>`;
  if (st.pdfFile) imp += `<div class="toolbar"><input type="password" id="st-pass" data-field="st-pass" placeholder="PDF password (if it has one)" autocomplete="off" aria-label="PDF password"><button class="primary" data-act="pdf-read" ${S.busy.pdf ? 'disabled' : ''}>${S.busy.pdf ? 'Reading…' : 'Read PDF'}</button><span class="small muted">${esc(st.pdfFile.name)}</span></div>`;
  if (st.error) imp += `<p class="err">${esc(st.error)}</p>`;
  if (st.parsed) {
    const cols = !st.map ? [] : (st.rows[st.map.headerRow] || []).map((c, i) => [i, P.squash(c) || `Column ${i + 1}`]);
    const sel = (k, label) => `<label class="small">${label}<br><select id="map-${k}" data-field="map" data-v="${k}"><option value="-1">—</option>${cols.map(([i, c]) => `<option value="${i}" ${st.map[k] === i ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>`;
    const p = st.parsed || []; const tot = P.statementTotals(p);
    if (st.pdf) imp += st.pdf.breaks.length
      ? `<div class="status warn">Read by AI from ${st.pdf.pages} PDF page${st.pdf.pages === 1 ? '' : 's'}. <b>${st.pdf.breaks.length}</b> row${st.pdf.breaks.length === 1 ? '' : 's'} don't follow from the balance before (first: ${dLong(st.pdf.breaks[0].date)}, ${esc(st.pdf.breaks[0].narr.slice(0, 60))}). Check them against the PDF before reconciling.</div>`
      : `<div class="status info">Read by AI from ${st.pdf.pages} PDF page${st.pdf.pages === 1 ? '' : 's'}. Every row's balance follows from the one before, so no row was misread or skipped.</div>`;
    if (st.map) imp += `<div class="fields">${sel('date', 'Date')}${sel('narr', 'Narration')}${sel('debit', 'Withdrawal')}${sel('credit', 'Deposit')}${sel('amount', 'Amount (single column)')}${sel('drcr', 'Dr / Cr')}${sel('balance', 'Balance')}${sel('ref', 'Reference')}</div>`;
    imp += `      <p class="small">${p.length} rows · ${dLong(tot.from)} to ${dLong(tot.to)} · in <span class="num">${P.fmtINR(tot.inPaise)}</span> · out <span class="num">${P.fmtINR(tot.outPaise)}</span>
      ${tot.balanced === true ? ' · <span class="tag good">Balances add up</span>' : tot.balanced === false ? ' · <span class="tag crit">Balances don\'t add up: check the columns</span>' : ''}</p>
      <div class="tablewrap preview"><table><thead><tr><th>Date</th><th>Narration</th><th class="r">In</th><th class="r">Out</th><th class="r">Balance</th></tr></thead><tbody>
      ${p.slice(0, 6).map(r => `<tr><td class="num">${dShort(r.date)}</td><td class="party">${esc(r.narr)}</td><td class="r num">${r.dir === 'in' ? P.fmtINR(r.paise) : ''}</td><td class="r num">${r.dir === 'out' ? P.fmtINR(r.paise) : ''}</td><td class="r num">${r.balPaise != null ? P.fmtINR(r.balPaise) : ''}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="actions"><button class="primary" data-act="reconcile" ${p.length && !S.busy.recon ? '' : 'disabled'}>${S.busy.recon ? 'Reconciling…' : `Reconcile ${p.length} rows`}</button><button data-act="st-clear">Cancel</button></div>`;
  }
  if (st.result) imp += `<div class="status info">${st.result}</div>`;
  imp += `</div>`;
  const tbl = `<div class="panel tablewrap"><h3>Imported for ${esc(acctName(st.acct))}</h3>${done.length ? `<table><thead><tr><th>Period</th><th class="r">Rows</th><th class="r">Matched</th><th class="r">Added</th><th class="r">Alert not on stmt</th><th>Balance check</th><th>Imported</th></tr></thead><tbody>
    ${done.map(s => `<tr><td>${dShort(s.from)} – ${dLong(s.to)}</td><td class="r num">${s.rows}</td><td class="r num">${s.matched}</td><td class="r num">${s.added}</td><td class="r num">${s.missing}</td>
      <td>${s.balanced === true ? '<span class="tag good">Adds up</span>' : s.balanced === false ? '<span class="tag crit">Mismatch</span>' : '—'}${s.closing != null ? ` <span class="num small">${P.fmtINR(s.closing)}</span>` : ''}</td><td class="small muted">${ago(s.importedAt)}</td></tr>`).join('')}
  </tbody></table>` : '<p class="muted">No statements imported for this account yet.</p>'}</div>`;
  return imp + tbl;
}

// The spreadsheet reader is only needed for imports, so it loads on first use.
let xlsxPromise = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  xlsxPromise = xlsxPromise || new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(); s.onerror = () => { xlsxPromise = null; rej(new Error('The spreadsheet reader did not load. Check your connection and pick the file again.')); };
    document.head.appendChild(s);
  });
  return xlsxPromise;
}

async function loadStatementFile(file) {
  const st = S.stmt; st.error = null; st.result = null; st.rows = st.map = st.parsed = st.pdf = st.pdfFile = null;
  if (/\.pdf$/i.test(file.name) || file.type === 'application/pdf') {
    if (!window.BOOKS_LOCAL) st.error = 'PDF statements are only read by the local app. Download the Excel/CSV statement instead.';
    else st.pdfFile = file;
    return schedule();
  }
  try {
    await loadXlsx();
    const isCsv = /\.csv$/i.test(file.name) || file.type === 'text/csv';
    const wb = isCsv ? XLSX.read(await file.text(), { type: 'string', raw: true }) : XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    const map = P.detectColumns(rows);
    if (!map) throw new Error('Could not find a header row with Date and Narration/Description columns in this file.');
    st.rows = rows; st.map = map; st.file = file.name; st.parsed = P.statementRows(rows, map);
    if (!st.parsed.length) st.error = 'Found the header row but no transaction rows under it. Check the column choices below.';
  } catch (e) { st.error = e.message || String(e); }
  schedule();
}

async function readPdfStatement() {
  const st = S.stmt; if (!st.pdfFile) return;
  S.busy.pdf = true; st.error = null; schedule();
  try {
    const pass = ($('#st-pass') || {}).value || '';
    const r = await window.booksApi('POST', '/api/statement/pdf', st.pdfFile, { 'Content-Type': 'application/pdf', 'X-Password': encodeURIComponent(pass) });
    if (!r.rows.length) throw new Error('No transaction rows found in this PDF.');
    st.parsed = r.rows; st.pdf = { breaks: r.breaks, pages: r.pages }; st.file = st.pdfFile.name; st.pdfFile = null;
  } catch (e) { st.error = e.message || String(e); }
  S.busy.pdf = false; schedule();
}

async function reconcile() {
  const st = S.stmt; const rows = st.parsed; const a = S.accounts.get(st.acct);
  if (!rows || !rows.length || !a) return;
  S.busy.recon = true; schedule();
  try {
    const tot = P.statementTotals(rows);
    const lo = new Date(Date.parse(tot.from) - 4 * 86400000).toISOString().slice(0, 10);
    const hi = new Date(Date.parse(tot.to) + 4 * 86400000).toISOString().slice(0, 10);
    const cands = [...S.txns.values()].filter(t => t.acct === a.id && t.date >= lo && t.date <= hi);
    const m = P.matchStatement(rows, cands);
    let matched = 0, added = 0, missing = 0;
    for (const [ri, ti] of m.pairs) {
      const r = rows[ri], t = cands[ti];
      const patch = { recon: t.recon === 'stmt_only' ? 'stmt_only' : 'matched', stmtNarr: r.narr, stmtBal: r.balPaise, updated: Date.now() };
      if (!t.ref && r.ref) patch.ref = r.ref;
      if (!t.party && r.party) patch.party = r.party;
      await updDoc('txns/' + t.id, patch); matched++;
    }
    for (const ri of m.unmatchedRows) {
      const r = rows[ri];
      const base = { bank: a.bank, last4: a.last4, dir: r.dir, paise: r.paise, ref: r.ref, date: r.date, narr: r.narr };
      const id = docId(P.txnId(base));
      if (S.txns.has(id)) { await updDoc('txns/' + id, { recon: 'matched', stmtNarr: r.narr, stmtBal: r.balPaise }); matched++; continue; }
      const doc = newTxnDoc({ ...base, mode: r.mode, party: r.party, vpa: r.vpa, ts: Date.parse(r.date + 'T12:00:00+05:30') + ri, balPaise: null, parser: 'statement' }, id, a);
      doc.recon = 'stmt_only'; doc.stmtNarr = r.narr; doc.stmtBal = r.balPaise; doc.src = { stmt: true };
      await setDoc('txns/' + id, doc); added++;
    }
    for (const ti of m.unmatchedTxns) {
      const t = cands[ti];
      if (t.date >= tot.from && t.date <= tot.to && t.recon !== 'missing_in_stmt') { await updDoc('txns/' + t.id, { recon: 'missing_in_stmt', updated: Date.now() }); missing++; }
      else if (t.date >= tot.from && t.date <= tot.to) missing++;
    }
    await setDoc(`statements/${docId(`${a.id}_${tot.from}_${tot.to}`)}`, { acct: a.id, from: tot.from, to: tot.to, rows: rows.length, matched, added, missing,
      opening: tot.opening, closing: tot.closing, balanced: tot.balanced, inPaise: tot.inPaise, outPaise: tot.outPaise, file: st.file || '', importedAt: Date.now() });
    st.rows = st.map = st.parsed = st.pdf = null;
    st.result = `Reconciled ${rows.length} rows: <b>${matched}</b> matched an alert, <b>${added}</b> had no alert and were added to your to-do list${missing ? `, <b>${missing}</b> alert${missing === 1 ? '' : 's'} weren't on the statement (check them under To do)` : ''}.`;
  } catch (e) { st.error = 'Reconcile stopped: ' + (e.message || e.code || e); }
  S.busy.recon = false; schedule();
}
